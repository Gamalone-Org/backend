version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: gamalone_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-gamalone}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gamalone_network

  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gamalone_backend
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-gamalone}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-change-in-production}
    ports:
      - '5000:5000'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - /app/dist
    networks:
      - gamalone_network
    command: npm run dev

  # Optional: Redis (commented out for now)
  # redis:
  #   image: redis:7-alpine
  #   container_name: gamalone_redis
  #   ports:
  #     - '6379:6379'
  #   networks:
  #     - gamalone_network

volumes:
  postgres_data:
    driver: local

networks:
  gamalone_network:
    driver: bridge
